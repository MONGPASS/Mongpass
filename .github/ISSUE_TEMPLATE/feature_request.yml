name: Feature request
description: 이용자 문제와 개선 아이디어를 제안합니다.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 한국 거주 몽골인 이용자가 겪는 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: 대상 이용자
      placeholder: 일반 사용자, 소상공인, 관리자, 번역 기여자 등
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: checkboxes
    id: contribution
    attributes:
      label: 기여 가능 여부
      options:
        - label: 이 기능의 구현 또는 검토에 참여할 수 있습니다.
